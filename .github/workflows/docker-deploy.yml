name: Docker CI and deployment
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare CI configuration
        run: cp deploy/production.env.example .env
      - name: Validate Compose and build production images
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml build --pull backend frontend
      - name: Verify backend startup and authentication
        run: bash deploy/smoke.sh
      - name: Validate web server configuration
        run: docker run --rm -e SITE_ADDRESS=http://localhost --entrypoint caddy "abassurance-frontend:$RELEASE_TAG" validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Package tested images and sources
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          docker save "abassurance-backend:$RELEASE_TAG" "abassurance-frontend:$RELEASE_TAG" | gzip > /tmp/images.tar.gz
          git archive --format=tar.gz -o /tmp/source.tar.gz HEAD
      - name: Deploy to OVH
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Configure VPS_HOST}" "${VPS_USER:?Configure VPS_USER}"
          : "${VPS_SSH_KEY:?Configure VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          remote="$VPS_USER@$VPS_HOST"
          target="/opt/abassurance/releases/$RELEASE_TAG"
          ssh -p "$port" "$remote" "mkdir -p '$target'"
          scp -P "$port" /tmp/source.tar.gz /tmp/images.tar.gz "$remote:$target/"
          ssh -p "$port" "$remote" "cd '$target' && tar -xzf source.tar.gz && bash deploy/deploy.sh '$RELEASE_TAG'"
