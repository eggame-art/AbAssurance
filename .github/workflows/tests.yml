name: Tests and coverage
on:
  push:
    branches: [develop, "feature/**"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e ".[dev,api,spark]"
      - run: python scripts/test_coverage.py --with-customer-isolation -q
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - name: Show backend coverage
        if: always()
        run: python scripts/coverage_summary.py backend >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/backend/
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - name: Show frontend coverage
        if: always()
        run: python ../scripts/coverage_summary.py frontend >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/
          retention-days: 14
