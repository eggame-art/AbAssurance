name: abassurance-production
services:
  oracle:
    extends: {file: compose.yaml, service: oracle}
    ports: !reset []
    networks: [data]
  sqlserver:
    extends: {file: compose.yaml, service: sqlserver}
    ports: !reset []
    networks: [data]
    environment:
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
  sqlserver-init:
    extends: {file: compose.yaml, service: sqlserver-init}
    networks: [data]
    entrypoint: ["/bin/bash", "/security/init.sh"]
    environment:
      SQLSERVER_PASSWORD_FILE: /run/secrets/sqlserver_app_password
    secrets: [sqlserver_app_password]
    volumes:
      - ./deploy/sqlserver:/security:ro
  kafka:
    extends: {file: compose.yaml, service: kafka}
    profiles: !reset []
    ports: !reset []
    networks: [data]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  namenode:
    extends: {file: compose.yaml, service: namenode}
    profiles: !reset []
    ports: !reset []
    networks: [data]
    environment:
      HADOOP_HEAPSIZE: "512"
  datanode:
    extends: {file: compose.yaml, service: datanode}
    profiles: !reset []
    networks: [data]
    environment:
      HADOOP_HEAPSIZE: "512"
  backend:
    image: abassurance-backend:${RELEASE_TAG:-local}
    platform: linux/amd64
    build: {context: ., dockerfile: server/Dockerfile.pipeline}
    secrets: [oracle_app_password, sqlserver_app_password]
    networks: [api, data, backend-egress]
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_DSN: oracle:1521/${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-ABASSURANCE}
      ORACLE_APP_PASSWORD_FILE: /run/secrets/oracle_app_password
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      SQLSERVER_USER: abassurance_reader
      SQLSERVER_PASSWORD_FILE: /run/secrets/sqlserver_app_password
      SQLSERVER_DATABASE: AssurePlus
      SQLSERVER_ENCRYPT: "yes"
      SQLSERVER_REQUIRE_SERVICE_ACCOUNT: "true"
      SQLSERVER_TRUST_CERTIFICATE: "yes"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-abassurance-check}
      KAFKA_TIMEOUT: ${KAFKA_TIMEOUT:-30}
      API_SPARK_MASTER: ${API_SPARK_MASTER:-local[2]}
      API_MODEL_ID: ${API_MODEL_ID:-}
      HDFS_HTTP_URL: http://namenode:9870
      HADOOP_CONF_DIR: /opt/hadoop-conf
      AUTH_DB_PATH: /var/lib/abassurance/auth.sqlite
      API_ROOT_PATH: /api
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      INTEGRATION_STATE_DIR: /var/lib/abassurance/integrations
      INTEGRATION_HDFS_ROOT: hdfs://namenode:9000/abassurance-web
      MODEL_OUTPUT_DIR: ${MODEL_OUTPUT_DIR:-hdfs://namenode:9000/abassurance-models/churn}
      API_ALLOW_EXPERIMENTAL: ${API_ALLOW_EXPERIMENTAL:-false}
      SOURCE_DATA_KIND: ${SOURCE_DATA_KIND:-demo}
    volumes:
      - pipeline-runs:/var/lib/abassurance
      - spark-ivy:/root/.ivy2
      - ./Infrastructure/hadoop/spark-core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./Infrastructure/hadoop/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    depends_on:
      oracle: {condition: service_healthy}
      sqlserver-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      namenode: {condition: service_healthy}
      datanode: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/auth/status', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
  frontend:
    image: abassurance-frontend:${RELEASE_TAG:-local}
    build: {context: ., dockerfile: client/Dockerfile}
    networks: [edge, api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://backend:8000/auth/status && test -s /srv/index.html"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
networks:
  # Caddy uses edge for incoming HTTP/HTTPS and certificate renewal.
  edge:
  # Only Caddy and the API share this isolated network.
  api:
    internal: true
  # Databases, Kafka and Hadoop are reachable only through the data network.
  data:
    internal: true
  # Spark needs outbound access to download its Maven connector.
  backend-egress:
secrets:
  # Compose reads these from the host/project environment, including .env.
  oracle_app_password:
    environment: ORACLE_APP_PASSWORD
  sqlserver_app_password:
    environment: SQLSERVER_PASSWORD
volumes:
  oracle-data:
  sqlserver-data:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:
  pipeline-runs:
  spark-ivy:
  caddy-data:
  caddy-config:
