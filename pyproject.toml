
[project]
name = "abassurance"
version = "0.1.0"
description = "Data integration platform for AbAssurance and AssurePlus"
requires-python = ">=3.11"

dependencies = [
    "oracledb>=2.0",
    "pyodbc>=5.0",
    "python-dotenv>=1.0",
    "confluent-kafka>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
spark = ["pyspark==3.5.8"]

[project.scripts]
abassurance-pipeline = "pipeline.run:main"
abassurance-kafka-publish = "messaging.producer:main"
abassurance-kafka-consume = "messaging.consumer:main"
abassurance-spark = "spark_pipeline.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "test",
    "integration: requires Oracle and SQL Server",
    "kafka_integration: requires databases and Kafka",
    "spark_integration: requires PySpark and Java",
    "spark_kafka_integration: requires PySpark, Java, databases and Kafka",
    "hdfs_integration: requires Spark and Docker HDFS",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
