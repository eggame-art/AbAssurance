
[project]
name = "abassurance"
version = "0.1.0"
description = "Data integration platform for AbAssurance and AssurePlus"
requires-python = ">=3.11"

dependencies = [
    "oracledb>=2.0",
    "pyodbc>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
abassurance-pipeline = "pipeline.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests en lecture seule sur les deux bases Docker"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
